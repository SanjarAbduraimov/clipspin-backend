version: '3.7'

services:
  backend:
    build:
      context: .
      dockerfile: ./dockerfile
    container_name: backend
    restart: always
    ports:
      - '3210:3000'
    env_file: .env

  queue:
    build:
      context: .
      dockerfile: ./queue.dockerfile
    container_name: queue
    restart: always
    env_file: .env

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
