version: '3.7'

services:
  backend:
    build:
      context: .
      dockerfile: ./dockerfile
    container_name: backend
    restart: always
    ports:
      - '3210:3000'
    env_file: .env

  queue:
    build:
      context: .
      dockerfile: ./queue.dockerfile
    container_name: queue
    restart: always
    env_file: .env

